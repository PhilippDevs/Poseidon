# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Loom version — shared across ALL version builds.
# Uses loom 1.16 which supports both obfuscated (1.21.x) and non-obfuscated (26.1+).
loom_version=1.16-SNAPSHOT

# Fabric Language Kotlin — compatible with all supported MC versions
fabric_kotlin_version=1.13.12+kotlin.2.4.0

# ─── Mod Properties ───────────────────────────────────────────────────────────
mod_version=1.0.0
maven_group=poseidon
mod_id=poseidon
mod_name=Poseidon

# ─── Per-version overrides ────────────────────────────────────────────────────
# These properties are overridden by the files in versions/<version>/gradle.properties
# minecraft_version, loader_version, fabric_version, mod_mc_dep
